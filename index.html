<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foyer 3D: Wilson &amp; Angelia’s Wedding Lunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6ece4;
  --panel: rgba(255, 251, 247, 0.88);
  --ink: #3a2622;
  --muted: #7a625b;
  --line: rgba(122, 55, 40, 0.18);
  --accent: #c8342b;
  --accent-ink: #ffffff;
  --peach: #f1b48f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1513;
    --panel: rgba(38, 27, 24, 0.88);
    --ink: #f6e9e1;
    --muted: #c4a99f;
    --line: rgba(246, 200, 180, 0.18);
    --accent: #e0483d;
    --peach: #e9a37b;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1513;
  --panel: rgba(38, 27, 24, 0.88);
  --ink: #f6e9e1;
  --muted: #c4a99f;
  --line: rgba(246, 200, 180, 0.18);
  --accent: #e0483d;
  --peach: #e9a37b;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
canvas { display: block; width: 100%; height: 100%; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 5;
}

.title {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 14px;
  max-width: min(360px, calc(100vw - 28px));
  padding: 14px 16px 13px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 6;
}
.title h1 {
  font-family: "Young Serif", Georgia, "Times New Roman", serif;
  font-weight: 400; font-size: 21px; line-height: 1.15; margin: 0 0 5px;
}
.title p { margin: 0; font-size: 13px; line-height: 1.4; color: var(--muted); }

.views {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; gap: 4px; padding: 4px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 6; max-width: calc(100vw - 20px);
}
.views button {
  appearance: none; border: 0; background: transparent; color: var(--ink);
  font: 500 13px/1 "DM Sans", system-ui, sans-serif;
  padding: 10px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.views button:hover { background: var(--line); }
.views button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.views button:focus-visible, .card button:focus-visible { outline: 2px solid var(--peach); outline-offset: 2px; }

.hint {
  position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 14px);
  max-width: 220px; font-size: 12px; line-height: 1.4; color: var(--muted);
  text-align: right; z-index: 6; transition: opacity .6s;
}

.card {
  position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
  width: min(300px, calc(100vw - 28px)); border-radius: 14px; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 6; transform: translateY(12px); opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s;
}
.card.open { transform: none; opacity: 1; pointer-events: auto; }
.card img { display: block; width: 100%; height: auto; }
.card .body { padding: 11px 14px 13px; }
.card h2 { font: 400 17px/1.2 "Young Serif", Georgia, serif; margin: 0 0 4px; }
.card p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
.card .close {
  position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.5); color: #fff; font-size: 18px; line-height: 1; cursor: pointer;
}
@media (max-width: 560px) {
  .hint { display: none; }
  .card { right: 50%; transform: translate(50%, 12px); }
  .card.open { transform: translate(50%, 0); }
  .views button { padding: 10px 11px; font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .hint { transition: none; }
}
</style>
</head>
<body>
<div id="stage"></div>

<div class="title">
  <h1>Wilson &amp; Angelia’s foyer</h1>
  <p>Wedding lunch, 28 November 2026, 12:00 PM. 3D render built from the ballroom floorplan.</p>
</div>
<div class="hint" id="hint">Drag to rotate, scroll to zoom, right-drag to pan. Tap a table for details.</div>

<div class="card" id="card" role="dialog" aria-live="polite">
  <button class="close" id="cardClose" aria-label="Close details">×</button>
  <img id="cardImg" alt="">
  <div class="body"><h2 id="cardTitle"></h2><p id="cardText"></p></div>
</div>

<div class="views" role="group" aria-label="Camera views">
  <button data-view="overview" aria-pressed="true">Overview</button>
  <button data-view="plan" aria-pressed="false">Plan view</button>
  <button data-view="album" aria-pressed="false">Album table</button>
  <button data-view="activity" aria-pressed="false">Activity table</button>
</div>

    box(0.42, 0.05, 0.42, 0x3b3330, 0, 0.45, 0, c);
    box(0.42, 0.45, 0.05, 0x3b3330, 0, 0.7, 0.2, c);
    [[-0.17, -0.17], [0.17, -0.17], [-0.17, 0.17], [0.17, 0.17]].forEach(function (l) { box(0.04, 0.43, 0.04, 0x3b3330, l[0], 0.215, l[1], c); });
  });
  label('Registration Table', X(981), 1.7, Z(187));

  /* ---------- photo panels ---------- */
  function photoPanel(parent, key, w, y, z, tilt) {
    var h = w * 0.75, g = new THREE.Group(); g.position.set(0, y, z); g.rotation.x = tilt; parent.add(g);
    var tex = loadTex(IMG[key]);
    box(w + 0.1, h + 0.1, 0.04, 0x8a6a4e, 0, 0, 0, g);
    var front = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
    front.position.z = 0.025; g.add(front);
    var back = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
    back.position.z = -0.025; back.rotation.y = Math.PI; g.add(back);
    return g;
  }
  function flatten(group, id) { group.traverse(function (o) { if (o.isMesh) { o.userData.focus = id; pickables.push(o); } }); }

  /* Album Table (photo 1 on the table) */
  var album = drapedTable(1.9, 0.7, 0xfffaf4); album.position.set(X(719), 0, Z(95));
  photoPanel(album, 'album', 1.25, TOP + 0.52, -0.08, -0.16);
  [-0.82, 0.82].forEach(function (dx) {
    cyl(0.07, 0.2, 0xeee6dc, dx, TOP + 0.1, 0.05, album, 16);
    [[0, 0.28, 0, 0xf2a774], [0.1, 0.22, 0.04, 0xf7c9a6], [-0.1, 0.24, -0.03, 0xe98e5a], [0.02, 0.36, 0.02, 0xfbe4c9]].forEach(function (f) {
      sphere(0.1, f[3], dx + f[0], TOP + f[1] + 0.12, 0.05 + f[2], album);
    });
  });
  var printTex = loadTex(IMG.album);
  var flat = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.375), new THREE.MeshBasicMaterial({ map: printTex }));
  flat.rotation.x = -Math.PI / 2; flat.rotation.z = 0.12; flat.position.set(0.25, TOP + 0.005, 0.2); album.add(flat);
  flatten(album, 'album');
  label('Album Table', X(719), 2.1, Z(95));

  /* Activity Table (photo 2 on the table) */
  var activity = drapedTable(1.9, 0.7, 0xfffaf4); activity.position.set(X(803), 0, Z(199));
  photoPanel(activity, 'activity', 1.2, TOP + 0.5, -0.08, -0.16);
  box(0.62, 0.62, 0.62, 0xd0312d, 0.7, TOP + 0.31, 0.12, activity, { roughness: 0.4, emissive: 0x5a0a08 });
  box(0.55, 0.05, 0.36, 0x2b2220, -0.55, TOP + 0.025, 0.18, activity);
  [[-0.7, 0xe97a8a], [-0.6, 0x6fb7a8], [-0.5, 0xf0c05a], [-0.4, 0x8d6bb8]].forEach(function (c) {
    sphere(0.04, c[1], c[0], TOP + 0.09, 0.18, activity);
  });
  flatten(activity, 'activity');
  label('Activity Table', X(803), 2.1, Z(199));

  /* ---------- orbit camera ---------- */
  var st = { theta: 0.3, phi: 0.95, r: 25, tx: 0, ty: 0, tz: 0.4 };
  function applyCam() {
    var sp = Math.sin(st.phi);
    camera.position.set(st.tx + st.r * sp * Math.sin(st.theta), st.ty + st.r * Math.cos(st.phi), st.tz + st.r * sp * Math.cos(st.theta));
    camera.lookAt(st.tx, st.ty, st.tz);
  }
  var views = {
    overview: { theta: 0.3, phi: 0.95, r: 25, tx: 0, ty: 0, tz: 0.4 },
    plan: { theta: 0, phi: 0.02, r: 27, tx: 0, ty: 0, tz: 0 },
    album: { theta: 0, phi: 1.2, r: 5.2, tx: X(719), ty: 1.0, tz: Z(95) },
    activity: { theta: 0, phi: 1.2, r: 5.2, tx: X(803), ty: 1.0, tz: Z(199) }
  };
  var copy = {
    album: { t: 'Album table', p: 'Framed wedding portraits and prints, with peach and coral florals at each end.', img: IMG.album },
    activity: { t: 'Activity table', p: 'DIY Fortune Knot: choose your charms, pick a cord, and tie a keepsake. The red double happiness box sits at the end.', img: IMG.activity }
  };
  var anim = null, current = 'overview';
  function flyTo(name) {
    var to = views[name]; if (!to) return;
    current = name;
    document.querySelectorAll('.views button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.view === name)); });
    var from = Object.assign({}, st);
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    anim = { from: from, to: to, t0: performance.now(), dur: reduce ? 1 : 1000 };
    var card = document.getElementById('card');
    if (copy[name]) {
      document.getElementById('cardImg').src = copy[name].img;
      document.getElementById('cardImg').alt = copy[name].t + ' photo';
      document.getElementById('cardTitle').textContent = copy[name].t;
      document.getElementById('cardText').textContent = copy[name].p;
      card.classList.add('open');
    } else { card.classList.remove('open'); }
  }
  document.querySelectorAll('.views button').forEach(function (b) {
    b.addEventListener('click', function () { flyTo(b.dataset.view); });
  });
  document.getElementById('cardClose').addEventListener('click', function () { flyTo('overview'); });

  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* pointer controls: drag rotates, right-drag or shift-drag pans, wheel and pinch zoom */
  var ptrs = new Map(), down = null, pinch0 = 0, r0 = 0;
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  stage.addEventListener('pointerdown', function (e) {
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
    if (ptrs.size === 2) {
      var p = Array.from(ptrs.values()); pinch0 = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); r0 = st.r;
      if (down) down.moved = 99;
    }
    anim = null;
  });
  stage.addEventListener('pointermove', function (e) {
    var p = ptrs.get(e.pointerId); if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 2) {
      var q = Array.from(ptrs.values()), d = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y);
      if (pinch0) st.r = clamp(r0 * pinch0 / d, 2.5, 45);
      return;
    }
    if (down) down.moved += Math.abs(dx) + Math.abs(dy);
    if (e.buttons & 2 || e.shiftKey) {
      var k = st.r * 0.0016;
      st.tx += (-Math.cos(st.theta) * dx + -Math.sin(st.theta) * dy) * k;
      st.tz += (Math.sin(st.theta) * dx + -Math.cos(st.theta) * dy) * k;
      st.tx = clamp(st.tx, -18, 18); st.tz = clamp(st.tz, -8, 8);
    } else {
      st.theta -= dx * 0.006;
      st.phi = clamp(st.phi - dy * 0.006, 0.02, 1.5);
    }
  });
  function endPtr(e) {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch0 = 0;
    if (down && down.moved < 6 && performance.now() - down.t < 500 && e.type === 'pointerup') pick(e.clientX, e.clientY);
    if (ptrs.size === 0) down = null;
  }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);
  stage.addEventListener('wheel', function (e) {
    e.preventDefault(); anim = null;
    st.r = clamp(st.r * Math.exp(e.deltaY * 0.0012), 2.5, 45);
  }, { passive: false });

  var ray = new THREE.Raycaster(), v2 = new THREE.Vector2();
  function pick(cx, cy) {
    var rect = renderer.domElement.getBoundingClientRect();
    v2.set(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(v2, camera);
    var hit = ray.intersectObjects(pickables, false)[0];
    if (hit && hit.object.userData.focus) flyTo(hit.object.userData.focus);
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h); camera.aspect = w / h;
    camera.fov = w < h ? 60 : 42; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  darkMQ.addEventListener && darkMQ.addEventListener('change', applyTheme);

  setTimeout(function () { document.getElementById('hint').style.opacity = '0.0'; }, 9000);

  function frame(now) {
    if (anim) {
      var t = clamp((now - anim.t0) / anim.dur, 0, 1), e = ease(t);
      ['theta', 'phi', 'r', 'tx', 'ty', 'tz'].forEach(function (k) { st[k] = anim.from[k] + (anim.to[k] - anim.from[k]) * e; });
      if (t >= 1) anim = null;
    }
    applyCam();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  resize(); applyTheme(); requestAnimationFrame(frame);
})();
</script>
